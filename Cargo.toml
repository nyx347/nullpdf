[package]
name = "nullpdf"
version = "1.0.0"
edition = "2021"
description = "Minimal PDF reader focused on freehand drawing/annotation"

[dependencies]
eframe = { version = "0.34", default-features = true }
egui = "0.34"
pdfium-render = "0.8.37"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
# Charmap lookups for export font fallback; already part of egui's font stack.
skrifa = "0.40"
# Accent-insensitive bookmark search; already built for egui-winit's link handling (url/idna).
icu_normalizer = { version = "2", default-features = false, features = ["compiled_data"] }

[build-dependencies]
# Embeds the icon and version info in the Windows exe.
winresource = { version = "0.1.34", default-features = false }

[features]
# Compile the pdfium library at NULLPDF_PDFIUM_LIB (an absolute path) into the binary, so it
# runs without a separate libpdfium: the portable Windows exe. Unpacked to the user's cache
# dir on start.
bundled-pdfium = []

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
